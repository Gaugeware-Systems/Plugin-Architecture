name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - uses: actions/checkout@v4
      - name: Install Boost
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-program-options-dev ninja-build
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
